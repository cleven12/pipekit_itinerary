{% extends "base.html" %}

{% block title %}Plan Your Trip · PipeKit Itinerary{% endblock %}

{% block content %}
<section class="hero">
  <h1>Plan your perfect trip</h1>
  <p>Tell us where you're headed and we'll build a personalized itinerary for you.</p>
</section>

<form class="itinerary-form" action="/generate" method="POST">
  <div class="field">
    <label for="destination">Destination</label>
    <input type="text" id="destination" name="destination" placeholder="e.g. Kyoto, Japan" required>
  </div>

  <div class="field">
    <label for="interests">Interests</label>
    <textarea id="interests" name="interests" placeholder="e.g. food, temples, hiking, local markets" rows="3"></textarea>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="duration">Duration (days)</label>
      <input type="number" id="duration" name="duration" min="1" max="30" placeholder="7" required>
    </div>

    <div class="field">
      <label for="group_size">Group size</label>
      <input type="number" id="group_size" name="group_size" min="1" max="50" placeholder="2" required>
    </div>
  </div>

  <button type="submit">Build my itinerary →</button>
</form>
{% endblock %}
